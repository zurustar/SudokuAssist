<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数独アシスト</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1b1d21;
    --muted: #6b7280;
    --faint: #9aa1ab;
    --line: #d4d7dd;
    --line-strong: #4a4f57;
    --user: #1b1d21;
    --auto: #1d6fd0;
    --sel: #d9e9fb;
    --peer: #eef1f5;
    --same: #cfe6d4;
    --err-bg: #fde3e1;
    --err: #c2372c;
    --btn: #eceef1;
    --btn-hover: #dfe2e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --surface: #1e2126;
      --text: #e8eaed;
      --muted: #9aa1ab;
      --faint: #6b7280;
      --line: #383c44;
      --line-strong: #8d949e;
      --user: #f0f2f5;
      --auto: #6fb1f5;
      --sel: #24405c;
      --peer: #24272d;
      --same: #2b4634;
      --err-bg: #4a2320;
      --err: #f08a80;
      --btn: #2a2e35;
      --btn-hover: #353a43;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    padding: 20px 16px 48px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .02em; }
  .lede { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

  .layout { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .boardcol { flex: 1 1 340px; min-width: 0; }
  .side { flex: 0 1 240px; min-width: 200px; }

  /* ---- board ---- */
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    background: var(--surface);
    border: 2.5px solid var(--line-strong);
    border-radius: 3px;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    user-select: none;
    touch-action: manipulation;
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: grid;
    place-items: stretch;
    cursor: pointer;
    transition: background-color .08s linear;
  }
  .cell.edge-r { border-right: 2.5px solid var(--line-strong); }
  .cell.edge-b { border-bottom: 2.5px solid var(--line-strong); }
  .cell:nth-child(9n) { border-right: none; }
  .cell:nth-child(n+73) { border-bottom: none; }

  .cell.peer { background: var(--peer); }
  .cell.same { background: var(--same); }
  .cell.sel  { background: var(--sel); }
  .cell.bad  { background: var(--err-bg); }
  .cell.sel::after {
    content: ""; position: absolute; inset: 0;
    border: 2px solid var(--auto); pointer-events: none;
  }

  .val {
    display: grid; place-items: center;
    font-size: clamp(18px, 5.4vw, 30px);
    font-weight: 500;
    line-height: 1;
  }
  .val.user { color: var(--user); font-weight: 600; }
  .val.auto { color: var(--auto); }
  .cell.bad .val { color: var(--err); }

  .cands {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%; height: 100%;
  }
  .cd {
    display: grid; place-items: center;
    font-size: clamp(7px, 1.85vw, 11px);
    line-height: 1;
    color: var(--faint);
    border-radius: 2px;
    cursor: pointer;
  }
  .cd.off { visibility: hidden; }
  .cd.hi { color: var(--auto); font-weight: 700; }
  .cd:not(.off):hover { background: var(--auto); color: #fff; }
  .cell.bad .cands::after {
    content: "×"; position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--err); font-size: clamp(16px, 4.5vw, 26px); pointer-events: none;
  }

  /* ---- side panel ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .status { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  .status.ok  { color: var(--auto); }
  .status.bad { color: var(--err); }
  .meta { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.7; }
  .meta b { color: var(--text); font-weight: 600; }

  .row { display: flex; gap: 8px; }
  button {
    flex: 1;
    font: inherit; font-size: 13px;
    padding: 9px 10px;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:disabled { opacity: .4; cursor: default; }

  .help { font-size: 12px; color: var(--muted); line-height: 1.85; margin: 0; }
  .help dt { font-weight: 600; color: var(--text); }
  .help dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .help dd { margin: 0; }
  kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; padding: 1px 5px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--btn);
  }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; justify-content: center; }
  .legend i { font-style: normal; font-weight: 700; }
  .toast {
    min-height: 16px; font-size: 12px; color: var(--err);
    text-align: center; margin-top: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>数独アシスト</h1>
    <p class="lede">
      確定した数字を入力すると、同じ行・列・3×3ブロックからその候補を消します。<br>
      候補が1つだけになったセルは自動で確定し、連鎖して絞り込まれます。
    </p>
  </header>

  <div class="layout">
    <div class="boardcol">
      <div class="board" id="board"></div>
      <div class="legend">
        <span><i style="color:var(--user)">5</i> 自分の入力</span>
        <span><i style="color:var(--auto)">5</i> 自動確定</span>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <aside class="side">
      <div class="card">
        <p class="status" id="status">入力待ち</p>
        <p class="meta">
          確定 <b id="filled">0</b> / 81　（自分 <b id="byuser">0</b>・自動 <b id="byauto">0</b>）<br>
          残り <b id="left">81</b> マス
        </p>
      </div>

      <div class="card">
        <div class="row">
          <button id="undo" disabled>← 元に戻す</button>
          <button id="redo" disabled>やり直す →</button>
        </div>
      </div>

      <div class="card">
        <dl class="help">
          <dt>数字を確定</dt><dd>セルを選んで <kbd>1</kbd>〜<kbd>9</kbd>、または候補の数字を直接クリック</dd>
          <dt>取り消し</dt><dd><kbd>0</kbd> / <kbd>Del</kbd> / <kbd>Back</kbd></dd>
          <dt>移動</dt><dd><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></dd>
          <dt>履歴</dt><dd><kbd>⌘Z</kbd> / <kbd>⇧⌘Z</kbd></dd>
        </dl>
      </div>
    </aside>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   モデル層 ― 盤面の真実の源は userValues のみ。
   自動確定セル・候補・矛盾はすべてそこから毎回導出する。
   ============================================================ */

const N = 81;
const ALL = [1,2,3,4,5,6,7,8,9];

const rowOf = i => (i / 9) | 0;
const colOf = i => i % 9;

// 27 個のユニット（行・列・ブロック）
const units = [];
for (let r = 0; r < 9; r++) units.push(ALL.map((_, c) => r * 9 + c));
for (let c = 0; c < 9; c++) units.push(ALL.map((_, r) => r * 9 + c));
for (let b = 0; b < 9; b++) {
  const r0 = ((b / 3) | 0) * 3, c0 = (b % 3) * 3, u = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) u.push((r0 + r) * 9 + c0 + c);
  units.push(u);
}

// 各セルが影響を受ける相手（同じ行・列・ブロックのセル）
const peers = Array.from({ length: N }, () => new Set());
for (const u of units) for (const i of u) for (const j of u) if (i !== j) peers[i].add(j);

/**
 * 人間の入力から盤面全体を導出する。
 *  1. 空きセルの候補 = 1〜9 から、同じ行・列・ブロックの確定値を除いたもの
 *  2. 候補が1つだけのセルは確定（唯一候補法）
 *  3. 変化がなくなるまで繰り返す（連鎖）
 */
function derive(userValues) {
  const values = userValues.slice();
  const origin = values.map(v => (v ? "user" : null));
  let cands = [];

  for (let guard = 0; guard <= N; guard++) {
    cands = new Array(N).fill(null);
    const singles = [];

    for (let i = 0; i < N; i++) {
      if (values[i]) continue;
      const s = new Set(ALL);
      for (const p of peers[i]) if (values[p]) s.delete(values[p]);
      cands[i] = s;
      if (s.size === 1) singles.push([i, s.values().next().value]);
    }

    if (singles.length === 0) break;          // 収束
    for (const [i, v] of singles) {
      values[i] = v;
      origin[i] = "auto";
      cands[i] = null;
    }
  }

  // 同一ユニット内での数字の重複
  const errors = new Set();
  for (const u of units) {
    const seen = new Map();
    for (const i of u) {
      const v = values[i];
      if (!v) continue;
      if (seen.has(v)) { errors.add(i); errors.add(seen.get(v)); }
      else seen.set(v, i);
    }
  }

  // 候補が尽きた空きセル（行き止まり）
  const dead = new Set();
  for (let i = 0; i < N; i++) if (!values[i] && cands[i].size === 0) dead.add(i);

  return { values, origin, cands, errors, dead };
}

/* ============================================================
   状態と履歴
   ============================================================ */

let userValues = new Array(N).fill(0);
let view = derive(userValues);
let sel = 40;                 // 選択中のセル（中央）
const past = [], future = [];

function commit(next) {
  past.push(userValues.slice());
  future.length = 0;
  userValues = next;
  view = derive(userValues);
  render();
}

function undo() {
  if (!past.length) return;
  future.push(userValues.slice());
  userValues = past.pop();
  view = derive(userValues);
  render();
}

function redo() {
  if (!future.length) return;
  past.push(userValues.slice());
  userValues = future.pop();
  view = derive(userValues);
  render();
}

/* ============================================================
   入力
   ============================================================ */

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.textContent = ""; }, 2600);
}

function place(i, v) {
  if (view.origin[i] === "auto") {
    toast("自動確定されたマスです。元に戻してから入力してください。");
    return;
  }
  if (userValues[i] === v) return;
  const next = userValues.slice();
  next[i] = v;
  commit(next);
}

function clearCell(i) {
  if (view.origin[i] === "auto") {
    toast("自動確定されたマスは消せません。元に戻してください。");
    return;
  }
  if (!userValues[i]) return;
  const next = userValues.slice();
  next[i] = 0;
  commit(next);
}

/* ============================================================
   描画
   ============================================================ */

const board = document.getElementById("board");

// セルの骨格を一度だけ作る
const cellEls = [];
for (let i = 0; i < N; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  if (colOf(i) % 3 === 2) cell.classList.add("edge-r");
  if (rowOf(i) % 3 === 2) cell.classList.add("edge-b");
  cell.dataset.i = i;

  const val = document.createElement("div");
  val.className = "val";

  const cands = document.createElement("div");
  cands.className = "cands";
  for (const d of ALL) {
    const cd = document.createElement("div");
    cd.className = "cd";
    cd.textContent = d;
    cd.dataset.d = d;
    cands.appendChild(cd);
  }

  cell.append(val, cands);
  board.appendChild(cell);
  cellEls.push({ cell, val, cands, cds: [...cands.children] });
}

function render() {
  const { values, origin, cands, errors, dead } = view;
  const selVal = values[sel];

  for (let i = 0; i < N; i++) {
    const { cell, val, cands: candBox, cds } = cellEls[i];
    const v = values[i];
    const bad = errors.has(i) || dead.has(i);

    // 背景のハイライト
    cell.classList.toggle("sel", i === sel);
    cell.classList.toggle("peer", i !== sel && peers[sel].has(i));
    cell.classList.toggle("same", i !== sel && !!selVal && v === selVal);
    cell.classList.toggle("bad", bad);

    if (v) {
      val.textContent = v;
      val.className = "val " + origin[i];
      val.style.display = "";
      candBox.style.display = "none";
    } else {
      val.style.display = "none";
      candBox.style.display = "";
      const set = cands[i];
      for (let k = 0; k < 9; k++) {
        const d = k + 1;
        const on = set.has(d);
        cds[k].classList.toggle("off", !on);
        cds[k].classList.toggle("hi", on && d === selVal);
      }
    }
  }

  // ステータス
  const byUser = origin.filter(o => o === "user").length;
  const byAuto = origin.filter(o => o === "auto").length;
  const filled = byUser + byAuto;
  document.getElementById("filled").textContent = filled;
  document.getElementById("byuser").textContent = byUser;
  document.getElementById("byauto").textContent = byAuto;
  document.getElementById("left").textContent = N - filled;

  const st = document.getElementById("status");
  st.className = "status";
  if (errors.size || dead.size) {
    st.classList.add("bad");
    st.textContent = dead.size && !errors.size
      ? "矛盾：候補が無いマスがあります"
      : "矛盾：同じ数字が重複しています";
  } else if (filled === N) {
    st.classList.add("ok");
    st.textContent = "完成しました";
  } else {
    st.textContent = filled === 0 ? "入力待ち" : "絞り込み中";
  }

  document.getElementById("undo").disabled = past.length === 0;
  document.getElementById("redo").disabled = future.length === 0;
}

/* ============================================================
   イベント
   ============================================================ */

board.addEventListener("pointerdown", e => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  const i = +cell.dataset.i;
  const cd = e.target.closest(".cd");

  if (cd && !cd.classList.contains("off")) {
    sel = i;
    place(i, +cd.dataset.d);      // 候補の数字を直接クリック → 確定
  } else {
    sel = i;
    render();
  }
});

document.addEventListener("keydown", e => {
  const k = e.key;

  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === "z") {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (k >= "1" && k <= "9") { e.preventDefault(); place(sel, +k); return; }
  if (k === "0" || k === "Delete" || k === "Backspace") { e.preventDefault(); clearCell(sel); return; }

  const move = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[k];
  if (move) {
    e.preventDefault();
    const r = Math.min(8, Math.max(0, rowOf(sel) + move[0]));
    const c = Math.min(8, Math.max(0, colOf(sel) + move[1]));
    sel = r * 9 + c;
    render();
  }
});

document.getElementById("undo").addEventListener("click", undo);
document.getElementById("redo").addEventListener("click", redo);

render();
</script>
</body>
</html>
